<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor | Celsius a Fahrenheit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-conversor">
        <h1>Conversor de Temperatura</h1>
        <p class="subtitulo">Convierte grados Celsius a Fahrenheit al instante.</p>

        <form class="formulario" id="form-conversor">
            <div class="grupo-formulario">
                <label for="celsius">Grados Celsius (°C)</label>
                <input type="text" id="celsius" placeholder="Ej: 25">
                <span class="mensaje-error" id="mensaje-error"></span>
            </div>

            <button type="button" id="btn-convertir" class="boton-convertir">
                Convertir <span>→</span>
            </button>

            <div class="grupo-formulario">
                <label for="fahrenheit">Grados Fahrenheit (°F)</label>
                <input type="text" id="fahrenheit" readonly placeholder="Resultado">
            </div>
        </form>
    </div>

    <script src="js/ejercicio10.js"></script>
</body>
</html>
