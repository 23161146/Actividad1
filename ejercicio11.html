<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor | Kilómetros a Millas</title>
</head>
<body>
    <h1>Conversor de Distancia</h1>
    <p>Convierte kilómetros a millas.</p>

    <form id="form-conversor">
        <label for="kilometros">Distancia en kilómetros (Km):</label><br>
        <input type="text" id="kilometros" placeholder="Ej: 10"><br>
        <span id="mensaje-error" style="color: red;"></span>
        <br><br>

        <button type="button" id="btn-convertir">Convertir</button>
        <br><br>

        <label for="millas">Distancia en millas (mi):</label><br>
        <input type="text" id="millas" readonly placeholder="Resultado">
    </form>

    <script src="js/ejercicio11.js"></script>
</body>
</html>
