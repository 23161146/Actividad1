<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor | Pesos Mexicanos a Dólares</title>
</head>
<body>
    <h1>Conversor de Divisas</h1>
    <p>Convierte pesos mexicanos (MXN) a dólares estadounidenses (USD).</p>

    <form id="form-conversor">
        <label for="mxn">Cantidad en pesos (MXN):</label><br>
        <input type="text" id="mxn" placeholder="Ej: 500"><br>
        <span id="mensaje-error" style="color: red;"></span>
        <br><br>

        <button type="button" id="btn-convertir">Convertir</button>
        <br><br>

        <label for="usd">Cantidad en dólares (USD):</label><br>
        <input type="text" id="usd" readonly placeholder="Resultado">
    </form>

    <script src="js/ejercicio12.js"></script>
</body>
</html>
