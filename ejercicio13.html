<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador | Edad para Votar</title>
</head>
<body>
    <h1>Verificador de Edad para Votar</h1>
    <p>Ingresa tu edad para saber si puedes votar.</p>

    <form id="form-verificador">
        <label for="edad">Edad:</label><br>
        <input type="text" id="edad" placeholder="Ej: 20"><br>
        <span id="mensaje-error" style="color: red;"></span>
        <br><br>

        <button type="button" id="btn-verificar">Verificar</button>
        <br><br>

        <label for="resultado">Resultado:</label><br>
        <input type="text" id="resultado" readonly placeholder="Resultado">
    </form>

    <script src="js/ejercicio13.js"></script>
</body>
</html>
