<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <title>Receta: Tacos al pastor (ñam)</title>
    </head>
    <body>
        <h1>Tacos al pastor caseros (ñam)</h1>
        <h2>Ingredientes:</h2>
        <ul>
            <li>Carne de cuche (500g)</li>
            <li>Piña (1 taza)
                <ul>
                    <li>Corada en cubos</li>
                </ul>
            </li>
            <li>Tortillas de maíz</li>
        </ul>
        <h2>Preparación:</h2>
        <ol>
            <li>Marinar la carne por 2 horas.</li>
            <li>Asar a fuego medio</li>
        </ol>
        <p>¡Sirve con cilantro, cebolla y salsas a gusto!</p>
    </body>
</html>
